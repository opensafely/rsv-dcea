version: '5.0'

actions:
  generate_dataset:
    run: >
      ehrql:v1 generate-dataset analysis/dataset_definition.py 
      --output output/dataset.arrow
      --test-data-file analysis/test_dataset_definition.py
    outputs:
      highly_sensitive:
        dataset: output/dataset.arrow

  data_process:
    run: r:v2 analysis/data_process.R 
    needs: 
      - generate_dataset
    outputs: 
      highly_sensitive:
        data: output/an_dataset_clean.arrow
      moderately_sensitive:
        table: output/tables/baseline_table*.csv
        rates: output/tables/rates*.csv

  data_check:
    run: r:v2 analysis/data_check.R
    needs:
    - data_process
    outputs:
      moderately_sensitive:
        check: output/tables/skim_clean.txt